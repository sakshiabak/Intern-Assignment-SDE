services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aereo:aereo@db:5432/aereo
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aereo
      POSTGRES_PASSWORD: aereo
      POSTGRES_DB: aereo
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
